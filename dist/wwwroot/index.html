<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>傍ら — 生成AIが書いた Markdown と HTML を見る</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="icon.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />
  <style>
    html, body { height: 100%; margin: 0; background: #f3eee4; }
    .splash {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse 80% 50% at 0% -10%, rgb(156 43 26 / 0.08), transparent),
        radial-gradient(ellipse 60% 40% at 100% 0%, rgb(47 74 60 / 0.07), transparent),
        #f3eee4;
      color: #1c1814;
    }
    .splash-inner { text-align: center; animation: splash-in 0.7s ease both; }
    .splash-icon {
      width: 112px;
      height: 112px;
      display: block;
      margin: 0 auto 18px;
      filter: drop-shadow(0 12px 20px rgb(28 24 20 / 0.14));
    }
    .splash-brand {
      margin: 0;
      font-family: "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
      font-size: 2.35rem;
      font-weight: 500;
      letter-spacing: 0.22em;
    }
    .splash-sub {
      margin: 12px 0 0;
      font-family: "Segoe UI", "Noto Sans JP", sans-serif;
      font-size: 13px;
      color: #6b6256;
      letter-spacing: 0.06em;
    }
    .splash-spin {
      width: 18px;
      height: 18px;
      margin: 22px auto 0;
      border: 2px solid #d9cbb6;
      border-top-color: #9c2b1a;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }
    @keyframes splash-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .splash-inner, .splash-spin { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash" class="splash" role="status" aria-live="polite">
    <div class="splash-inner">
      <img class="splash-icon" src="icon.png" width="112" height="112" alt="" />
      <p class="splash-brand">傍ら</p>
      <p class="splash-sub">生成AIが書いた Markdown と HTML を見る</p>
      <div class="splash-spin" aria-hidden="true"></div>
    </div>
  </div>
  <div id="app" class="app">
    <header class="top">
      <span class="brand"><img class="brand-mark" src="icon.png" width="22" height="22" alt="">傍ら</span>
      <form id="open-form" class="open-form">
        <input id="path" class="path" type="text" spellcheck="false" placeholder="プロジェクトフォルダ" aria-label="プロジェクトフォルダ" />
        <button class="btn" type="submit">開く</button>
        <button id="browse" class="btn outline" type="button" title="フォルダを選ぶ" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9L9.4 3.9A2 2 0 0 0 7.7 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/></svg>
        </button>
      </form>
      <div id="recents" class="recents"></div>
      <div id="status" class="status" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span id="status-text">読み込み中…</span>
      </div>
    </header>
    <div id="mode-banner" class="mode-banner" hidden>
      制限なしで起動しています。プレビューのスクリプトはアプリと同じ権限で動きます。信用できないフォルダは開かないでください。
    </div>
    <div id="error" class="error" hidden></div>
    <div class="split" id="split">
      <aside class="explorer" id="explorer">
        <div class="tools">
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
            <input id="query" type="search" placeholder="検索" />
          </div>
          <div class="tool-row">
            <button type="button" class="btn xs outline" id="expand-all" title="すべて開く">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 6 5 5 5-5"/><path d="m7 13 5 5 5-5"/></svg>
              すべて開く
            </button>
            <button type="button" class="btn xs outline" id="collapse-all" title="閉じる">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="m17 18-5-5-5 5"/><path d="m17 11-5-5-5 5"/></svg>
              閉じる
            </button>
          </div>
        </div>
        <div class="tree-scroll" id="tree-scroll">
          <div id="tree-busy" class="pane-busy">
            <span class="spinner" aria-hidden="true"></span>
            <span id="tree-busy-text">フォルダを読んでいます…</span>
          </div>
          <div id="tree"></div>
        </div>
      </aside>
      <div class="handle" id="handle" role="separator" aria-orientation="vertical"></div>
      <section class="preview" id="preview-wrap">
        <div id="preview" class="preview-inner">
          <div class="center loading">
            <span class="spinner" aria-hidden="true"></span>
            <span>読み込み中…</span>
          </div>
        </div>
      </section>
    </div>
  </div>
  <div id="ctx-menu" class="ctx-menu" hidden role="menu">
    <button type="button" role="menuitem" data-copy="name">ファイル名またはフォルダ名をコピー</button>
    <button type="button" role="menuitem" data-copy="rel">相対パスをコピー</button>
    <button type="button" role="menuitem" data-copy="full">フルパスをコピー</button>
  </div>
  <div id="ctx-preview" class="ctx-menu" hidden role="menu">
    <button type="button" role="menuitem" data-preview="copy">コピー</button>
    <button type="button" role="menuitem" data-preview="link" hidden>リンクアドレスをコピー</button>
    <button type="button" role="menuitem" data-preview="source">ソースを開く</button>
  </div>
  <div id="copy-toast" class="copy-toast" hidden>コピーしました</div>
  <script src="marked.min.js"></script>
  <script src="purify.min.js"></script>
  <script src="mermaid.min.js"></script>
  <script src="syntax.js"></script>
  <script src="app.js"></script>
</body>
</html>
